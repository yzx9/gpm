[package]
name = "gpm"
description = "Android-first age-only gopass password client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gpm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-safe-area = { path = "../../crates/tauri-plugin-safe-area" }
tauri-plugin-keystore = { path = "../../crates/tauri-plugin-keystore" }
tauri-plugin-file-picker = { path = "../../crates/tauri-plugin-file-picker" }
tauri-plugin-screen-secure = { path = "../../crates/tauri-plugin-screen-secure" }
tauri-plugin-clipboard-notify = { path = "../../crates/tauri-plugin-clipboard-notify" }
tauri-plugin-background-work = { path = "../../crates/tauri-plugin-background-work" }
tauri-plugin-device-info = { path = "../../crates/tauri-plugin-device-info" }
tauri-plugin-file-save = { path = "../../crates/tauri-plugin-file-save" }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
# Tarball stack for the diagnostics/repo export archive assemblers — both pure
# Rust and configured at the workspace level; cross-build under the Android NDK
# with no C and no cmake.
tar.workspace = true
flate2.workspace = true
rustpass = { path = "../../crates/rustpass" }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["rt", "fs", "sync"] }
base64 = { workspace = true }
# Cold-start release probe (RFC R090): a no-follow HTTPS GET that reads the
# GitHub release-redirect `Location`. `rustls` only — Android-NDK-compatible
# (no native-tls/openssl), and no body/charset/http2 features needed for one
# header read. Resolved transitively via `tauri` (without TLS), so only the
# rustls provider is newly compiled.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Stable-only version compare for the release probe (RFC R090).
semver = "1"
sys-locale = "0.3"
log = "0.4"
ts-rs = { workspace = true }

# Android-only: the headless background-sync JNI entry. `jni` for the
# `#[no_mangle]` shim in `jni_sync.rs`; `rt-multi-thread` for its owned
# `tokio::runtime` (host builds don't compile the shim).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = { workspace = true }
age = { workspace = true }
git2 = { workspace = true }
# `macros` + `rt-multi-thread` for `#[tokio::test]`; `sync` for the test-only
# crypto serializer (tokio::sync::Semaphore); `time` comes from the workspace dep.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
# Enables `tauri::test` (the mock-runtime harness) during `cargo test`. Cargo
# unifies this with the [dependencies] tauri, so it adds the feature only for
# test builds.
tauri = { version = "2", features = ["test"] }

[lints]
workspace = true
