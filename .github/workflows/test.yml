name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          rust_cache: true
          pnpm_cache: true

      - name: Dump build env + restored fingerprints (diagnostic)
        # DIAGNOSTIC: the flake.lock hash is in the rust-cache key, yet cargo's
        # unit hashes drift across runs (0 fingerprint reuse). This dumps, in
        # the SAME nix shell the build uses, exactly which rustc/cargo/env the
        # build sees, and what .fingerprint dirs were restored — to tell apart
        # (a) build using the runner's stray rustup instead of fenix rustc,
        # (b) cleanup stripping registry fingerprints, (c) an env var outside
        # the envHash prefixes differing across runs.
        shell: nix develop .#ci-lite --accept-flake-config --command sh -e {0}
        run: |
          echo "=== which -a rustc cargo rustup ==="
          which -a rustc cargo rustup 2>/dev/null || true
          echo "=== rustc -vV ==="
          rustc -vV || true
          echo "=== cargo -vV ==="
          cargo -vV || true
          echo "=== relevant env (sorted) ==="
          printenv | sort | grep -iE '^(CC|CXX|CFLAGS|CXXFLAGS|CPPFLAGS|PKG_CONFIG|NIX_|LD_|RUST|CARGO|PATH=|SOURCE_DATE|HOST_)' || true
          echo "=== restored .fingerprint: count + serde/libc/gpm sample ==="
          ls target/debug/.fingerprint/ 2>/dev/null | wc -l
          ls target/debug/.fingerprint/ 2>/dev/null | grep -E '^(serde|libc|cfg-if|gpm|rustpass)' | head -20

      - name: Run backend tests
        shell: nix develop .#ci-lite --accept-flake-config --command sh -e {0}
        # DIAGNOSTIC: every backend run restores a full-match rust-cache target/
        # yet cargo recompiles all ~510 crates (0 Fresh). The fingerprint trace
        # prints "fingerprint error for <crate> ... .fingerprint/<crate>-<HASH>"
        # so the mismatched/missing HASH reveals whether restored fingerprints
        # drift (UnitHash) or never landed (restore/cleanup). Scoped to this
        # step only, so it never enters the rust-cache key (computed in the
        # setup step) — the cache still full-matches, isolating the cause.
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=trace
        run: |
          pnpm install --frozen-lockfile
          just test-be

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          pnpm_cache: true

      - name: Run frontend tests
        shell: nix develop .#ci-lite --accept-flake-config --command sh -e {0}
        run: |
          pnpm install --frozen-lockfile
          sh scripts/gen-icons.sh
          just test-fe

  # Runs every local Android plugin's Robolectric/JVM unit tests via the
  # aggregated `testPlugins` gradle task. The tests are pure JVM (no NDK, no Rust
  # artifacts), but gradle can't even configure without tauri.settings.gradle
  # present — and that file is gitignored, generated only by `tauri android
  # build`. So a single-ABI debug build is done first purely to produce it; the
  # unit tests then run on the configured project. A guard first verifies every
  # local path plugin in app/src-tauri/Cargo.toml is included, so a stale generation
  # can't silently skip a plugin's tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          rust_cache: true
          pnpm_cache: true
          java_cache: true

      - name: Build single-ABI + run plugin tests
        # gen-icons + a single-ABI debug build produce the gitignored
        # tauri.settings.gradle that gradle needs to configure; `just test-plugin`
        # then guards that every local plugin in Cargo.toml is included and runs
        # the aggregated `testPlugins` task on the configured project.
        shell: nix develop .#ci-full --accept-flake-config --command sh -e {0}
        run: |
          pnpm install --frozen-lockfile
          sh scripts/gen-icons.sh
          pnpm -C app tauri android build --debug --target aarch64
          just test-plugin
